<title>Pitampura Ground Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#efe9dc; --bg2:#d9d2c0; --panel:rgba(248,244,235,.9); --ink:#3a2a1f; --ink2:#7a6a5a;
  --brass:#9a7634; --line:rgba(58,42,31,.18); --btn:rgba(58,42,31,.06); --btnon:#3a2a1f; --btnon-ink:#f6f1e7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1612; --bg2:#2b241d; --panel:rgba(30,25,20,.9); --ink:#efe6d6; --ink2:#a89883;
  --brass:#c9a45c; --line:rgba(239,230,214,.2); --btn:rgba(239,230,214,.08); --btnon:#efe6d6; --btnon-ink:#1b1612;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1b1612; --bg2:#2b241d; --panel:rgba(30,25,20,.9); --ink:#efe6d6; --ink2:#a89883;
  --brass:#c9a45c; --line:rgba(239,230,214,.2); --btn:rgba(239,230,214,.08); --btnon:#efe6d6; --btnon-ink:#1b1612;
  color-scheme:dark;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(var(--bg2),var(--bg) 70%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.caps{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
#top{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
#brand{color:var(--ink)}#brand b{color:var(--brass);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button,.pill{border:0;background:transparent;padding:6px 16px;min-height:44px;min-width:44px}
.seg button[aria-pressed=true],.pill[aria-pressed=true]{background:var(--btnon);color:var(--btnon-ink)}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bottom>*{pointer-events:auto}
#bar{display:flex;gap:6px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(6px)}
.pill{border-radius:999px}
#sheet{display:none;width:min(560px,100%);max-height:42vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:8px;box-sizing:border-box;backdrop-filter:blur(6px)}
#sheet.open{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}

#sheet button:hover{border-color:var(--brass)}
#sheet h6{grid-column:1/-1;margin:2px 4px;color:var(--brass);font-weight:600}

<div id="app">

  <div id="top">

<script type="module">
import * as THREE from 'three';

$('bViews').onclick = () => sheet('views'); $('bRooms').onclick = () => sheet('rooms');

function goView(k) {

// ---- collision: horizontal rays at 3 heights against all non-roof meshes (three-mesh-bvh)

// ---- input
const keys = new Set();

let lookId = null, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => { if (mode !== 'walk' || lookId !== null) return; lookId = e.pointerId; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); canvas.focus({preventScroll: true}); });

</script>
